[project]
name = "post-pandemic-box-office"
version = "0.1.0"
description = "Using machine learning, we study the performance of movies with respect to a range of features (budget, IMDb rating, release month, etc.) and establish that there is no significant difference in the assessment thereof when comparing pre- and post-pandemic movies."
authors = [
    {name = "sestupinansalamanca@gmail.com"}
]
license = "MIT"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pandas (>=2.0,<3.0)",
    "numpy (>=2.5.1,<3.0.0)",
    "scikit-learn (>=1.9.0,<2.0.0)",
    "mlflow (>=3.15.1,<4.0.0)",
    "tensorflow (>=2.21.0,<3.0.0)",
    "joblib (>=1.5.3,<2.0.0)",
    "seaborn (>=0.13.2,<0.14.0)",
    "matplotlib (>=3.11.1,<4.0.0)"
]

[tool.poetry]
package-mode = false


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "jupyter (>=1.1.1,<2.0.0)",
    "ipykernel (>=7.3.0,<8.0.0)"
]
